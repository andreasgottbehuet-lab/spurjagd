name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Unit and integration tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Publish verification summary
        if: always()
        run: |
          echo '## SPURJAGD – technische Prüfung' >> "$GITHUB_STEP_SUMMARY"
          echo '- Testlauf: siehe Schritt Unit and integration tests' >> "$GITHUB_STEP_SUMMARY"
          echo '- TypeScript und Build: siehe Schritt TypeScript and production build' >> "$GITHUB_STEP_SUMMARY"
          echo '- A5-Druckbild: manuelle Browserprüfung weiterhin erforderlich' >> "$GITHUB_STEP_SUMMARY"

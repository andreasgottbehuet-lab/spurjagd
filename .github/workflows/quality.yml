name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record tested revision
        run: |
          mkdir -p verification
          echo "commit=$GITHUB_SHA" | tee verification/revision.txt
          node --version | tee -a verification/revision.txt
          npm --version | tee -a verification/revision.txt
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/tests.log
      - name: TypeScript and production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/build.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spurjagd-verification-${{ github.run_id }}
          path: verification/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verification summary
        if: always()
        run: |
          echo '## SPURJAGD – technische Prüfung' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Testlauf: siehe Schritt Unit and integration tests und Artefakt tests.log' >> "$GITHUB_STEP_SUMMARY"
          echo '- TypeScript und Build: siehe Schritt TypeScript and production build und Artefakt build.log' >> "$GITHUB_STEP_SUMMARY"
          echo '- A5-Druckbild: manuelle Browserprüfung weiterhin erforderlich' >> "$GITHUB_STEP_SUMMARY"

name: Quality checks
on:
  push:
    branches: [main, 'feature/print-preflight-hardening-20261104']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record tested revision
        run: |
          mkdir -p verification
          echo "commit=$GITHUB_SHA" | tee verification/revision.txt
          node --version | tee -a verification/revision.txt
          npm --version | tee -a verification/revision.txt
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # No package-lock.json is committed yet. Capture the resolved dependency tree for review.
      - name: Record resolved dependency versions
        run: |
          test -f package-lock.json
          cp package-lock.json verification/generated-package-lock.json
          npm ls --depth=0 > verification/dependencies.txt 2>&1
      - name: Verify A5 print invariants
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/print-dom-audit.test.mjs tests/print-css.test.mjs 2>&1 | tee verification/a5-print-tests.log
      - name: Unit and integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/tests.log
      - name: TypeScript and production build
        if: success() || failure()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/build.log
      - name: Install Chromium browser test tooling
        if: success()
        run: |
          set -o pipefail
          {
            npm install --no-save --no-audit --no-fund playwright
            npx playwright install --with-deps chromium
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          } 2>&1 | tee verification/a5-browser-setup.log
      - name: Verify generated A5 PDF in Chromium
        if: success()
        run: |
          set -o pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > verification/vite-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Vite preview failed to start; see verification/vite-preview.log' | tee verification/a5-browser-tests.log
            exit 1
          fi
          node scripts/verify-a5-browser.mjs 2>&1 | tee verification/a5-browser-tests.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spurjagd-verification-${{ github.run_id }}
          path: verification/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verification summary
        if: always()
        run: |
          echo '## SPURJAGD – technische Prüfung' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Aufgelöste Abhängigkeiten: generated-package-lock.json und dependencies.txt im Artefakt (noch nicht versioniert)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Testlauf: siehe Schritt Unit and integration tests und Artefakt tests.log' >> "$GITHUB_STEP_SUMMARY"
          echo '- TypeScript und Build: siehe Schritt TypeScript and production build und Artefakt build.log' >> "$GITHUB_STEP_SUMMARY"
          echo '- A5-Drucklogik: siehe Schritt Verify A5 print invariants und Artefakt a5-print-tests.log' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chromium-Probedruck: siehe a5-browser-tests.log, a5-browser-report.json und PDF/PNG-Vorschauen im Artefakt' >> "$GITHUB_STEP_SUMMARY"
          echo '- A5-Druckbild: visueller A5-Probedruck weiterhin erforderlich' >> "$GITHUB_STEP_SUMMARY"
